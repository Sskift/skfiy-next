name: CI

on:
  push:
  pull_request:

jobs:
  locked-use-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorization and installation policy tests
        run: make test-locked-use
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Locked-use policy tests
        run: make test-locked-use
      - name: Authorization plugin boundary tests (no system installation)
        run: make test-locked-use-plugin
      - name: Installer authdb round-trip (temporary unreferenced test rules only)
        run: sudo python3 Tests/LockedUseCoreTests/authdb_roundtrip.py
      - name: Build and verify native guardian and authorization bundle
        run: make locked-use
      - name: Compile isolated manual smoke-test fixture
        run: swiftc scripts/fixtures/LockedUseFixture.swift -o .build/locked-use-tests/fixture
