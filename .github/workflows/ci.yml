name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test --no-parallel
      - name: Browser session isolation and cancellation
        run: node scripts/test_browser_sessions.mjs
      - name: One-step install, setup and uninstall (throwaway HOME, fake claude/codex)
        run: make test-install

  browser-integration:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure temporary test directories
        run: |
          echo "CFT_CACHE=$RUNNER_TEMP/skfiy-chrome" >> "$GITHUB_ENV"
          echo "SKFIY_TEST_EVIDENCE=$RUNNER_TEMP/browser-evidence" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: swift build
      - name: Install disposable Chrome for Testing
        run: npx --yes @puppeteer/browsers install chrome@stable --path "$CFT_CACHE"
      - name: Native bridge slow-client isolation
        run: python3 scripts/test_bridge_backpressure.py .build/debug/skfiy
      - name: Real Chrome lifecycle and injected failures
        run: python3 scripts/test_browser_lifecycle.py .build/debug/skfiy
      - name: Preserve browser, MCP and phase timing logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-integration-evidence
          path: ${{ env.SKFIY_TEST_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 7
