<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>skfiy web fixture</title>
<style>
  body { font: 14px -apple-system, sans-serif; margin: 16px; }
  section { margin: 8px 0; }
  #scroller { height: 90px; width: 260px; overflow: auto; border: 1px solid #999; }
  canvas { border: 1px solid #333; }
  #editor { border: 1px solid #999; padding: 4px; width: 260px; }
</style>
</head>
<body>
<h1>skfiy web fixture</h1>
<p id="status">status: ready</p>
<section>
  <a href="#linked" id="link" onclick="log('link clicked', event)">Go link</a>
  <button id="btn" onclick="log('button clicked', event)">Press me</button>
  <label><input type="checkbox" id="agree" onchange="log('checkbox ' + this.checked, event)"> Agree</label>
  <label>Fruit <select id="fruit" onchange="log('select ' + this.value, event)">
    <option>apple</option><option>banana</option><option>cherry</option>
  </select></label>
</section>
<section>
  <label>Name <input id="name" oninput="log('input ' + this.value, event)"></label>
  <label>Notes <textarea id="notes" rows="2" oninput="log('textarea ' + this.value, event)"></textarea></label>
</section>
<section>
  <form id="search" onsubmit="log('submitted ' + document.getElementById('query').value, event); return false;">
    <input id="query" aria-label="Query"> <button type="submit">Search</button>
  </form>
</section>
<section>
  <div id="editor" contenteditable="true" role="textbox" aria-label="Editor" oninput="log('editor ' + this.textContent, event)">edit me</div>
</section>
<section>
  <div id="scroller" role="region" aria-label="Scroller" tabindex="0"></div>
</section>
<section>
  <canvas id="canvas" width="300" height="120" aria-label="Canvas"></canvas>
</section>
<section>
  <label>Attachment <input id="upload" type="file"></label>
  <button id="alert">Alert me</button>
  <button id="confirm">Confirm me</button>
  <button id="prompt">Prompt me</button>
</section>
<section>
  <!-- Same origin, and cross origin (localhost vs 127.0.0.1): frames report to this page. -->
  <iframe id="same" title="Same-origin frame" width="300" height="90"></iframe>
  <iframe id="cross" title="Cross-origin frame" width="300" height="90"></iframe>
</section>
<script>
  function log(message, event) {
    const trusted = event && event.isTrusted === false ? ' untrusted' : '';
    document.getElementById('status').textContent = 'status: ' + message + trusted;
  }
  const scroller = document.getElementById('scroller');
  for (let i = 1; i <= 40; i++) {
    const line = document.createElement('div');
    line.textContent = 'row ' + i;
    scroller.appendChild(line);
  }
  scroller.addEventListener('scroll', (e) => log('scroll ' + Math.round(scroller.scrollTop), e));
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#4a8'; ctx.fillRect(0, 0, 150, 120);
  ctx.fillStyle = '#e84'; ctx.fillRect(150, 0, 150, 120);
  canvas.addEventListener('click', (e) => log('canvas ' + (e.offsetX < 150 ? 'green' : 'orange'), e));
  document.getElementById('upload').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    log(file ? `file ${file.name} ${file.size} bytes: ${(await file.text()).slice(0, 20).trim()}` : 'file none', e);
  });
  document.getElementById('alert').addEventListener('click', (e) => { alert('Saved!'); log('alerted', e); });
  document.getElementById('confirm').addEventListener('click', (e) => log('confirm ' + confirm('Sure?'), e));
  document.getElementById('prompt').addEventListener('click', (e) => log('prompt ' + prompt('Name?', 'default'), e));
  // Frames: the page's own frame file, served from both hosts.
  const frameURL = (host) => `http://${host}:${location.port}/frame.html`;
  document.getElementById('same').src = frameURL(location.hostname);
  document.getElementById('cross').src = frameURL(location.hostname === 'localhost' ? '127.0.0.1' : 'localhost');
  addEventListener('message', (e) => { if (typeof e.data === 'string' && e.data.startsWith('frame ')) log(e.data); });
  // Keys held down: one keydown, one keyup, the time between them.
  const pressedAt = {};
  document.addEventListener('keydown', (e) => { if (!e.repeat) pressedAt[e.key] = performance.now(); }, true);
  document.addEventListener('keyup', (e) => {
    const held = performance.now() - (pressedAt[e.key] || performance.now());
    if (held > 250) log(`held ${e.key} ${Math.round(held / 100) / 10}s`, e);
  }, true);
  document.addEventListener('keydown', (e) => {
    if (e.target === document.body) {
      log('key ' + (e.metaKey ? 'cmd+' : '') + (e.ctrlKey ? 'ctrl+' : '') + e.key, e);
    }
  });
</script>
</body>
</html>
